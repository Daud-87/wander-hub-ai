function populateLanguages(){
  const source = document.getElementById("sourceLang");
  const target = document.getElementById("targetLang");

  source.innerHTML = "";
  target.innerHTML = "";

  for(const code in LANGUAGES){
    const label = LANGUAGES[code];

    // Source
    const opt1 = document.createElement("option");
    opt1.value = code;
    opt1.textContent = label;
    source.appendChild(opt1);

    // Target (NO auto detect)
    if(code !== "auto"){
      const opt2 = document.createElement("option");
      opt2.value = code;
      opt2.textContent = label;
      target.appendChild(opt2);
    }
  }

  // Defaults
  source.value = "auto";
  target.value = "en";
}

      /* ================== CONFIG ================== */
      const GEMINI_API_KEY = ""; // optional (leave empty if not using)

      /* ================== Chat backends ================== */
      async function publicAgentReply(userText){
        const q=userText.trim(); const lower=q.toLowerCase();
        // weather
        const wx=lower.match(/(?:weather|temp|temperature)\s+(?:in|at)\s+(.+)/);
        if(wx){
          const place=wx[1].replace(/[?.!]+$/,'').trim();
          const g=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(place)}&count=1&language=en&format=json`);
          const gj=await g.json(); if(!gj?.results?.length) return `I couldn’t find "${place}". Try a bigger city name.`;
          const {latitude,longitude,name,country}=gj.results[0];
          const w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true&timezone=auto`);
          const wj=await w.json(); const cw=wj?.current_weather; if(!cw) return `Weather data not available for ${name}, ${country}.`;
          return `Weather for ${name}, ${country}:\n• Temperature: ${cw.temperature}°C\n• Wind: ${cw.windspeed} km/h\n• Time: ${cw.time}`;
        }
        // currency
        const convAmt=lower.match(/convert\s+([\d.,]+)\s*([a-z]{3})\s*(?:to|in|→)\s*([a-z]{3})/)||
                      lower.match(/([\d.,]+)\s*([a-z]{3})\s*(?:to|in|→)\s*([a-z]{3})/i);
        const pairOnly=lower.match(/([a-z]{3})\s*(?:to|in|→)\s*([a-z]{3})/i);
        if(convAmt){
          const amt=Number(convAmt[1].replace(/,/g,'')); const from=convAmt[2].toUpperCase(); const to=convAmt[3].toUpperCase();
          if(!isFinite(amt)) return "Please provide a valid amount, e.g., convert 120 usd to pkr";
          const r=await fetch(`https://api.exchangerate.host/convert?from=${from}&to=${to}&amount=${amt}&places=6`);
          const j=await r.json(); const out=j?.result;
          return (typeof out==='number')?`${amt} ${from} = ${out.toLocaleString()} ${to} (rate: ${j.info?.rate})`:"I couldn't fetch the conversion right now.";
        }else if(pairOnly){
          const from=pairOnly[1].toUpperCase(); const to=pairOnly[2].toUpperCase();
          const r=await fetch(`https://api.exchangerate.host/latest?base=${from}&symbols=${to}`); const j=await r.json(); const rate=j?.rates?.[to];
          return (typeof rate==='number')?`1 ${from} = ${rate} ${to} (date: ${j.date})`:"I couldn't fetch that rate right now.";
        }
        // about/info
        const about=lower.match(/^(?:about|info|tell me about)\s+(.+)/);
        if(about){
          const topic=about[1].trim();
          try{
            const rc=await fetch(`https://restcountries.com/v3.1/name/${encodeURIComponent(topic)}?fullText=false`);
            const rj=await rc.json();
            if(Array.isArray(rj)&&rj[0]){
              const c=rj[0]; const name=c.name?.common||topic; const capital=Array.isArray(c.capital)?c.capital.join(', '):(c.capital||'—');
              const region=c.region||'—'; const currencyCode=c.currencies?Object.keys(c.currencies)[0]:'—';
              const languageList=c.languages?Object.values(c.languages).join(', '):'—';
              return `Country: ${name}\nRegion: ${region}\nCapital: ${capital}\nCurrency: ${currencyCode}\nLanguages: ${languageList}\nPopulation: ${c.population?.toLocaleString?.()||'—'}`;
            }
          }catch(_) {}
          const w=await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(topic)}`);
          if(w.ok){ const js=await w.json(); const summary=js.extract||js.description||'No summary.'; return summary.length>900?summary.slice(0,900)+'…':summary; }
          return "I couldn't find info on that topic.";
        }
        return `I’m a free public travel helper. Try:
  • “weather in Lahore”
  • “convert 100 usd to pkr”
  • “usd to eur”
  • “about Pakistan”`;
      }

      async function geminiChatCall(userText){
        if(!GEMINI_API_KEY) throw new Error("NO_GEMINI_KEY");
        const body={ contents:[{ role:"user", parts:[{ text:`You are Wander Hub AI, a friendly travel assistant.\nUser: ${userText}` }]}] };
        const res=await fetch(GEMINI_URL,{ method:"POST", headers:{ "Content-Type":"application/json","x-goog-api-key":GEMINI_API_KEY }, body:JSON.stringify(body) });
        if(!res.ok){ let msg=res.statusText; try{ msg=(await res.json())?.error?.message||msg }catch{} throw new Error(msg.includes("API key")?"NO_GEMINI_KEY":msg); }
        const data=await res.json(); const text=(data?.candidates?.[0]?.content?.parts||[]).map(p=>p.text).join("\n").trim();
        return text||"No answer.";
      }

      function getDeepseekKey(){
        let key=(localStorage.getItem(DS_KEY_STORAGE)||"").trim();
        if(!key){ key=(prompt("Enter your DeepSeek/OpenRouter API key (stored locally in your browser):")||"").trim(); if(key) localStorage.setItem(DS_KEY_STORAGE,key); }
        return key;
      }
      function resetDeepseekKey(){ localStorage.removeItem(DS_KEY_STORAGE); alert("DeepSeek/OpenRouter key cleared. Next chat will ask again."); }

      async function deepseekChatCall(userText){
        const key=getDeepseekKey(); if(!key) throw new Error("NO_DS_KEY");
        const isOR=key.startsWith("sk-or-"); const url=isOR?OR_URL:DS_NATIVE_URL; const model=isOR?OR_MODEL:DS_NATIVE_MODEL;
        const body={ model, messages:[ {role:"system",content:"You are Wander Hub AI, a friendly travel assistant. Be concise and helpful."}, {role:"user",content:userText} ], temperature:0.7 };
        const headers={ "Content-Type":"application/json", "Authorization":"Bearer "+key };
        if(isOR){ headers["HTTP-Referer"]=location.origin||"http://localhost"; headers["X-Title"]="Wander Hub AI"; }
        const res=await fetch(url,{ method:"POST", headers, body:JSON.stringify(body) });
        if(!res.ok){ const t=await res.text(); if(/unauthorized|invalid|forbidden|401|403/i.test(t)) throw new Error("NO_DS_KEY"); throw new Error(t||"DeepSeek/OpenRouter error"); }
        const data=await res.json(); const text=data?.choices?.[0]?.message?.content?.trim();
        return text||"No answer.";
      }
async function translateText() {
  const input = document.getElementById("inputText").value.trim();
  const output = document.getElementById("outputText");
  let source = document.getElementById("sourceLang").value;
  let target = document.getElementById("targetLang").value;

  if (!input || !source || !target) {
    alert("Please fill all fields.");
    return;
  }

  if (source === "zh-CN") source = "zh";
  if (target === "zh-CN") target = "zh";

  output.value = "⏳ Translating...";

  try {
    const res = await fetch("/translate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text: input,
        source_lang: source,
        target_lang: target
      })
    });

    const data = await res.json();
    output.value = data.translated_text || "⚠️ Translation failed.";

    if (data.translated_text) {
      playTTS(data.translated_text, target);
    }

  } catch (err) {
    console.error(err);
    output.value = "⚠️ Server error.";
  }
}

function closeChatbot(){
  document.getElementById("chatbotBox").style.display = "none";
}



async function playTTS(text, lang){
  try{
    const res = await fetch("/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, lang })
    });

    const data = await res.json();
    if(!data.audio_url) return;

    // 🔹 Show audio ONLY under translation output
    const outputBox = document.getElementById("outputText");

    // Remove old audio if exists
    document.getElementById("translationAudio")?.remove();

    const audioWrapper = document.createElement("div");
    audioWrapper.id = "translationAudio";
    audioWrapper.className = "mt-3";

    audioWrapper.innerHTML = `
      <audio controls class="w-full">
        <source src="${data.audio_url}" type="audio/mpeg">
      </audio>
    `;

    outputBox.parentNode.appendChild(audioWrapper);

  }catch(err){
    console.error("TTS error:", err);
  }
}

      /* ================== Unified chat ================== */
     async function sendChat(){
  const chatInput = document.getElementById("chatInput");
  const chatArea  = document.getElementById("chatArea");
  const msg = chatInput.value.trim();
  if(!msg) return;

  

  // USER MESSAGE
  chatArea.innerHTML += `
    <div class="chat-msg chat-user">
      ${escapeHtml(msg)}
    </div>
  `;
  chatInput.value="";
  scrollChatToBottom();

  // AI TYPING
  chatArea.innerHTML += `
    <div id="aiTyping" class="chat-msg chat-ai">
      AI is typing...
    </div>
  `;
  scrollChatToBottom();

  try{
    let aiMsg;
    const low = msg.toLowerCase();
    const needsTool = /(weather|temp|temperature)\s+(in|at)\s+/.test(low) ||
                      /\b(usd|pkr|eur|gbp|aed|sar|inr|cny|jpy|cad|aud|try|chf|qar|kwd|omr|bdt|myr|sgd|thb)\s*(to|in|→)\s*(usd|pkr|eur|gbp|aed|sar|inr|cny|jpy|cad|aud|try|chf|qar|kwd|omr|bdt|myr|sgd|thb)\b/.test(low) || /^convert\s+/.test(low) ||
                      /^(about|info|tell me about)\s+/.test(low);
    if(needsTool){
      aiMsg = await publicAgentReply(msg);
    }else{
      try{
        let j = null;
        for(let i=0;i<2 && !(j && j.reply);i++){
          try{
            const r = await fetch("/chat", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ message: msg }) });
            j = await r.json();
          }catch(_){ j = null; }
        }
        aiMsg = (j && j.reply) ? j.reply : "The AI is busy right now. Please try again in a moment.\n\nMeanwhile you can ask:\n  • “weather in Lahore”\n  • “convert 100 usd to pkr”\n  • “about Pakistan”";
      }catch{
        aiMsg = await publicAgentReply(msg);
      }
    }

    document.getElementById("aiTyping")?.remove();

    chatArea.innerHTML += `
      <div class="chat-msg chat-ai whitespace-pre-wrap">
        ${escapeHtml(aiMsg)}
      </div>
    `;
    scrollChatToBottom();

  }catch(e){
    document.getElementById("aiTyping")?.remove();
    chatArea.innerHTML += `
      <div class="chat-msg chat-ai text-red-600">
        Error: ${escapeHtml(e.message)}
      </div>
    `;
    scrollChatToBottom();
  }
}

      window.sendChat = sendChat;

      /* ================== UX helpers ================== */
      function scrollChatToBottom(){
        const el=document.getElementById('chatArea'); if(!el) return;
        requestAnimationFrame(()=>{ el.scrollTop = el.scrollHeight; });
      }
      // Enter to send (Shift+Enter = newline)
      document.getElementById('chatInput')?.addEventListener('keydown',e=>{
        if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); }
      });
      // Observe message changes and keep pinned
      new MutationObserver(scrollChatToBottom).observe(document.getElementById('chatArea'),{childList:true});
      document.addEventListener('DOMContentLoaded', scrollChatToBottom);

      // Draggable popup by the gradient header
      (function enableDrag(){
        const box=document.getElementById('chatbotBox'); if(!box) return;
        const handle=box.querySelector('.flex.flex-col > div'); if(!handle) return;
        handle.style.cursor='grab';
        let down=false,sx=0,sy=0,sl=0,st=0;
        function md(e){
          down=true; handle.style.cursor='grabbing';
          const r=box.getBoundingClientRect();
          box.style.left=r.left+'px'; box.style.top=r.top+'px'; box.style.right='auto'; box.style.bottom='auto';
          sx=e.clientX; sy=e.clientY; sl=r.left; st=r.top;
          document.addEventListener('mousemove',mm); document.addEventListener('mouseup',mu);
        }
        function mm(e){
          if(!down) return;
          const L=Math.min(Math.max(0, sl+(e.clientX-sx)), innerWidth - box.offsetWidth);
          const T=Math.min(Math.max(0, st+(e.clientY-sy)), innerHeight - box.offsetHeight);
          box.style.left=L+'px'; box.style.top=T+'px';
        }
        function mu(){ down=false; handle.style.cursor='grab'; document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu); }
        handle.addEventListener('mousedown',md);
        addEventListener('resize',()=>{
          const r=box.getBoundingClientRect();
          box.style.left=Math.min(Math.max(0,r.left), innerWidth - box.offsetWidth)+'px';
          box.style.top =Math.min(Math.max(0,r.top ), innerHeight- box.offsetHeight)+'px';
        });
      })();
    </script>
  </body>
  </html>
