<!DOCTYPE html>
<html lang="en">
<head>
<script src="config.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Wander Hub Ai</title>

  <link rel="icon" type="image/png" href="templates/logofinal.png">
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; }
    .msg-success { background:#ecfdf5;border:2px solid #10b981;color:#065f46; }
    .msg-error { background:#fef2f2;border:2px solid #ef4444;color:#7f1d1d; }
    .hidden { display:none; }
  </style>
<link rel="stylesheet" href="responsive.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-orange-400 via-sky-200 to-orange-100 flex flex-col">

<!-- HEADER -->
<header class="flex items-center justify-between px-10 py-4 bg-white/80 backdrop-blur-md shadow-md">
  <div class="flex items-center gap-3 text-orange-700 font-bold text-lg">
    <img src="templates/logofinal.png" class="w-10 h-10 rounded-full bg-white shadow">
    Wander Hub Ai
  </div>
  <a href="login.html" class="text-orange-600 font-semibold hover:underline">
    Back to Login
  </a>
</header>

<!-- MAIN -->
<main class="flex flex-1 justify-center items-center px-6">
  <div class="bg-white/90 backdrop-blur-md shadow-2xl rounded-3xl p-10 w-full max-w-md">

    <h2 class="text-3xl font-bold text-orange-700 text-center mb-2">
      Forgot Password
    </h2>

    <p class="text-gray-500 text-center mb-6">
      Reset your password directly using your registered email
    </p>

    <!-- EMAIL -->
    <label class="block text-gray-700 font-medium mb-2">
      Email Address
    </label>
    <input id="email" type="email" placeholder="Enter your registered email"
      class="w-full h-12 px-4 rounded-xl border bg-sky-50
             focus:ring-2 focus:ring-orange-400 outline-none mb-4">

    <!-- NEW PASSWORD -->
    <label class="block text-gray-700 font-medium mb-2">
      New Password
    </label>
    <input id="newPass" type="password" placeholder="Enter new password"
      class="w-full h-12 px-4 rounded-xl border bg-sky-50
             focus:ring-2 focus:ring-orange-400 outline-none mb-4">

    <!-- CONFIRM PASSWORD -->
    <label class="block text-gray-700 font-medium mb-2">
      Confirm Password
    </label>
    <input id="confirmPass" type="password" placeholder="Confirm new password"
      class="w-full h-12 px-4 rounded-xl border bg-sky-50
             focus:ring-2 focus:ring-orange-400 outline-none">

    <!-- BUTTON -->
    <button onclick="resetPassword()" id="resetBtn"
      class="w-full mt-6 h-12 bg-gradient-to-r from-orange-500 to-sky-400
             text-white font-bold rounded-full shadow-lg hover:scale-[1.02] transition">
      Reset Password
    </button>

    <!-- MESSAGE -->
    <div id="msg" class="hidden mt-6 p-4 rounded-xl text-sm"></div>

  </div>
</main>

<!-- FOOTER -->
<footer class="text-center py-4 text-sm text-gray-600 bg-white/60">
  © 2025 Wander Hub Ai — All Rights Reserved
</footer>

<script>
const API = window.WH_API_BASE;

function show(msg, success){
  const box = document.getElementById("msg");
  box.className = "mt-6 p-4 rounded-xl " + (success ? "msg-success" : "msg-error");
  box.innerHTML = msg;
  box.classList.remove("hidden");
}
fetch(window.WH_API_BASE + "/api/auth/reset-password", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({
    email: email,
    newPassword: password
  })
});

async function resetPassword(){
  const email = document.getElementById("email").value.trim();
  const p1 = document.getElementById("newPass").value;
  const p2 = document.getElementById("confirmPass").value;
  const btn = document.getElementById("resetBtn");

  if(!email || !p1 || !p2){
    return show("All fields are required.", false);
  }

  if(p1.length < 6){
    return show("Password must be at least 6 characters.", false);
  }

  if(p1 !== p2){
    return show("Passwords do not match.", false);
  }

  btn.disabled = true;
  btn.innerText = "Resetting...";

  try{
    const res = await fetch(API + "/api/auth/forgot-password-direct", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ email, newPassword: p1 })
    });

    const data = await res.json();

    if(!data.success){
      btn.disabled = false;
      btn.innerText = "Reset Password";
      return show(data.message || "Unable to reset password.", false);
    }

    show("✅ Password reset successfully. Redirecting to login...", true);
    setTimeout(()=> window.location.href = "login.html", 2000);

  }catch(err){
    console.error(err);
    btn.disabled = false;
    btn.innerText = "Reset Password";
    show("Server error. Please try again later.", false);
  }
}
</script>

<script src="responsive.js"></script>
</body>
</html>
